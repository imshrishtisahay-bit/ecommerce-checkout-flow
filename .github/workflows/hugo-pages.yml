name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.1"
          extended: true

      - name: Build site
        working-directory: process/week-8/capstone
        run: |
          hugo --gc --minify --baseURL "https://imshrishtisahay-bit.github.io/shrishti22.github.io/"

      - name: Create .nojekyll
        run: touch process/week-8/capstone/public/.nojekyll

      - name: Deploy to target Pages repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: imshrishtisahay-bit/shrishti22.github.io
          publish_branch: main
          publish_dir: process/week-8/capstone/public
          user_name: GitHub Actions
          user_email: actions@github.com
          force_orphan: true