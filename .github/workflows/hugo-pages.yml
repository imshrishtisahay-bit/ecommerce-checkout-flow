name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.140.1'
          extended: true

      - name: Build site
        working-directory: process/week-8/capstone
        run: hugo --gc --minify

      - name: Create .nojekyll
        run: touch process/week-8/capstone/public/.nojekyll

      - name: Deploy to target Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: imshrishtisahay-bit/shrishti22.github.io
          publish_branch: gh-pages
          publish_dir: process/week-8/capstone/public
          github_token: ${{ secrets.GH_PAT }}
          keep_files: true
